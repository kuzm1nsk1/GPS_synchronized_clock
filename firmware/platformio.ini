; PlatformIO project — GPS Synchronized Clock
;
; The Dasduino CORE is an ATmega328P @ 16 MHz. Per the upload notes, use the
; Arduino Nano (OLD bootloader) profile: board = nanoatmega328.
;
; The sketch (gps_clock.cpp) and the custom MAX7219 driver live in gps_clock/.
; Wire, EEPROM and SoftwareSerial ship with the Arduino AVR core, so they need
; no lib_deps entry.

[platformio]
src_dir = gps_clock

[env:dasduino_core]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
lib_deps =
    adafruit/RTClib
    mikalhart/TinyGPSPlus
    https://github.com/SolderedElectronics/Soldered-Rotary-Encoder-With-easyC-Arduino-Library.git
    https://github.com/SolderedElectronics/Soldered-SHTC3-Temperature-Humidity-Sensor-Arduino-Library.git

; NOTE: the two Soldered libraries depend on Soldered's easyC/generic library.
; PlatformIO should resolve it automatically from their library.properties. If a
; build fails with a missing easyC/generic header, add the generic library
; explicitly, e.g.:
;   https://github.com/SolderedElectronics/Soldered-Generic-Arduino-Library.git
